ShortDescription: Zero-Elevation Network Diagnostics & Geolocation Workstation
Description: |
  NetPulse is a tactical, zero-elevation desktop network workstation engineered with
  Tauri v2 (Rust + React 19). It provides 10 unified network diagnostics including
  visual traceroute, live ping/jitter sparklines, high-speed port scanning, DNSSEC
  inspection, and WHOIS/RDAP query tools without requiring administrator privileges
  or third-party kernel drivers.
