name: 'Release NetPulse Workstation'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build NetPulse Desktop Application & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NetPulse v__VERSION__'
          releaseBody: |
            ## NetPulse Zero-Elevation Diagnostics Workstation v__VERSION__
            
            ### Automated Binary Installers
            - **Windows**: `NetPulse___VERSION___x64-setup.exe` (NSIS Installer)
            - **macOS**: `NetPulse___VERSION___universal.dmg` (Intel & Apple Silicon)
            - **Linux**: `NetPulse___VERSION___amd64.deb` & `NetPulse___VERSION____amd64.AppImage`
            
            ### Integrity & Verification
            All bundles include SHA256 cryptographic hashes and Ed25519 signature metadata in `latest.json`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
