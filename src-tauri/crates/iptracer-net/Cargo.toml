[package]
name = "iptracer-net"
version = "1.0.0"
edition = "2021"
authors = ["NetPulse Core Engineering Team"]
description = "Platform Abstraction Layer (PAL) sockets: Windows Iphlpapi, Unix ICMP/datagram, and TCP connect fallback"

[dependencies]
iptracer-core = { path = "../iptracer-core" }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
