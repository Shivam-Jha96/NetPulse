[package]
name = "iptracer-core"
version = "1.0.0"
edition = "2021"
authors = ["NetPulse Core Engineering Team"]
description = "Core network diagnostic engines, models, error taxonomy, and state machines"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
