[package]
name = "iptracer-daemon"
version = "1.0.0"
edition = "2021"
authors = ["NetPulse Core Engineering Team"]
description = "Privileged helper daemon contracts, raw socket operations, and IPC server"

[lib]
name = "iptracer_daemon"
path = "src/lib.rs"

[[bin]]
name = "iptracer-helper"
path = "src/main.rs"

[dependencies]
iptracer-core = { path = "../iptracer-core" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
