[package]
name = "iptracer-geo"
version = "1.0.0"
edition = "2021"
authors = ["NetPulse Core Engineering Team"]
description = "Multi-provider egress IP cascade, offline GeoLite2 fallback reader, and threat intelligence scoring"

[dependencies]
iptracer-core = { path = "../iptracer-core" }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
