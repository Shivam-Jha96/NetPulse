[workspace]
members = [
    "crates/iptracer-core",
    "crates/iptracer-net",
    "crates/iptracer-geo",
    "crates/iptracer-daemon",
    "crates/iptracer-ui",
    ".",
]
resolver = "2"

[package]
name = "netpulse-desktop"
version = "1.0.0"
edition = "2021"
authors = ["NetPulse Core Engineering Team"]
description = "NetPulse Cross-Platform Network Diagnostics Desktop Application"

[dependencies]
iptracer-core = { path = "crates/iptracer-core" }
iptracer-net = { path = "crates/iptracer-net" }
iptracer-geo = { path = "crates/iptracer-geo" }
iptracer-ui = { path = "crates/iptracer-ui" }
tauri = { version = "2.2", features = [] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[[bin]]
name = "netpulse"
path = "src/main.rs"
